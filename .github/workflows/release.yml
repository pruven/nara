name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NARA_UPDATE_PUBLIC_KEY: ${{ vars.NARA_UPDATE_PUBLIC_KEY }}

jobs:
  linux:
    name: Linux archive (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libglib2.0-dev libinput-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libfontconfig1-dev libfreetype-dev libssl-dev
          rustup update stable
      - name: Test and build
        run: |
          cargo test --release --locked
          cargo build --release --locked
      - name: Package and test installation
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          package=nara-linux-${{ matrix.arch }}
          mkdir -p "dist/$package"
          install -m755 target/release/nara packaging/linux/install.sh "dist/$package/"
          install -m644 README.md LICENSE packaging/linux/nara.desktop packaging/linux/nara.svg "dist/$package/"
          test_home=$(mktemp -d)
          HOME="$test_home" XDG_DATA_HOME="$test_home/share" "dist/$package/install.sh" "dist/$package/nara"
          test -x "$test_home/.local/bin/nara"
          test -f "$test_home/share/applications/nara.desktop"
          "$test_home/.local/bin/nara" --help
          tar -C dist -czf "dist/$package.tar.gz" "$package"
      - uses: actions/upload-artifact@v6
        with:
          name: nara-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows installer and ZIP (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test and build
        shell: pwsh
        run: |
          rustup update stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust update failed' }
          rustup target add ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw 'Rust target installation failed' }
          if ('${{ matrix.arch }}' -eq 'arm64') {
            # Windows on ARM can run the x64 shader compiler from the SDK.
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
            $env:GPUI_FXC_PATH = Get-ChildItem $sdkBin -Directory -Filter '10.*' |
              Sort-Object { [version]$_.Name } -Descending |
              ForEach-Object { Join-Path $_.FullName 'x64/fxc.exe' } |
              Where-Object { Test-Path $_ -PathType Leaf } |
              Select-Object -First 1
            if (!$env:GPUI_FXC_PATH) { throw 'Windows SDK shader compiler not found' }
          }
          cargo test --locked --release --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cargo build --release --locked --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Package
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $output = (Resolve-Path dist).Path
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          $binary = (Resolve-Path "target/${{ matrix.target }}/release/nara.exe").Path
          & $iscc "/O$output" "/DAppArch=${{ matrix.arch }}" "/DAppBinary=$binary" packaging/windows/nara.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Compress-Archive -Path $binary, README.md, LICENSE -DestinationPath "dist/nara-windows-${{ matrix.arch }}.zip"
      - name: Test installation and uninstall
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'Nara install test'
          $install = Start-Process "dist/nara-windows-${{ matrix.arch }}-setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"" -Wait -PassThru
          if ($install.ExitCode -ne 0 -or !(Test-Path "$destination/nara.exe")) { throw 'Nara was not installed' }
          $handler = Get-ItemPropertyValue 'HKCU:/Software/Nara/Capabilities/URLAssociations' -Name https
          if ($handler -ne 'Nara.WebLink') { throw 'HTTPS handler registration is missing' }
          $uninstall = Start-Process "$destination/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$destination/nara.exe")) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v6
        with:
          name: nara-windows-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: nara-*
          merge-multiple: true
          path: packages
      - name: Sign release checksums
        working-directory: packages
        env:
          NARA_UPDATE_PRIVATE_KEY: ${{ secrets.NARA_UPDATE_PRIVATE_KEY }}
        run: |
          test -n "$NARA_UPDATE_PRIVATE_KEY" || { echo "Missing NARA_UPDATE_PRIVATE_KEY"; exit 1; }
          umask 077
          signing_dir=$(mktemp -d)
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s\n' "$NARA_UPDATE_PRIVATE_KEY" > "$signing_dir/key.pem"
          public_key=$(openssl pkey -in "$signing_dir/key.pem" -pubout -outform DER | od -An -v -tx1 | tr -d ' \n')
          test "$public_key" = "302a300506032b6570032100$NARA_UPDATE_PUBLIC_KEY" || {
            echo "Signing key does not match NARA_UPDATE_PUBLIC_KEY"
            exit 1
          }
          assets=(nara-linux-{x86_64,aarch64}.tar.gz
            nara-windows-{x86_64,arm64}-setup.exe nara-windows-{x86_64,arm64}.zip)
          sha256sum "${assets[@]}" > SHA256SUMS
          { printf 'nara-release-%s\n' "$GITHUB_REF_NAME"; cat SHA256SUMS; } > "$signing_dir/manifest"
          openssl pkeyutl -sign -rawin -inkey "$signing_dir/key.pem" \
            -in "$signing_dir/manifest" -out SHA256SUMS.sig
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          cd packages
          mapfile -t assets < <(cut -d ' ' -f 3- SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" SHA256SUMS SHA256SUMS.sig \
            --verify-tag --title "Nara $GITHUB_REF_NAME" --generate-notes
